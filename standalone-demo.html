<script>
/* math.js */
/* Gloria Esser Teaching Tool math engine v1.0 — original, deterministic, dependency free.
   No AI-generated runtime answers. All answers use integer rational arithmetic. */
(function(global){'use strict';
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
function F(n,d=1){if(!Number.isSafeInteger(n)||!Number.isSafeInteger(d)||d===0)throw Error('Invalid fraction');let g=gcd(n,d);let sign=d<0?-1:1;return {n:n/g*sign,d:Math.abs(d)/g};}
function add(a,b){return F(a.n*b.d+b.n*a.d,a.d*b.d)}
function subtract(a,b){return F(a.n*b.d-b.n*a.d,a.d*b.d)}
function mul(a,b){return F(a.n*b.n,a.d*b.d)}
function compare(a,b){return Math.sign(a.n*b.d-b.n*a.d)}
function show(a){return a.d===1?String(a.n):a.n+'/'+a.d}
function parse(input){let s=String(input||'').trim().replace(/\s+/g,' ').replace('−','-');
 if(!s)return null;
 if(/^[-+]?\d+\s+\d+\/\d+$/.test(s)){const m=s.match(/^([-+]?\d+)\s+(\d+)\/(\d+)$/);const w=Number(m[1]),n=Number(m[2]),d=Number(m[3]);if(d===0||n>=d)return null;return F((Math.abs(w)*d+n)*(w<0?-1:1),d);}
 if(/^[-+]?\d+\/[-+]?\d+$/.test(s)){const [n,d]=s.split('/').map(Number);return d?F(n,d):null;}
 if(/^[-+]?\d+(\.\d+)?$/.test(s)){if(s.includes('.')){const negative=s.startsWith('-');const [integer,frac]=s.replace(/^[-+]/,'').split('.');if(frac.length>8)return null;const d=10**frac.length;return F((Number(integer)*d+Number(frac))*(negative?-1:1),d);}return F(Number(s),1);}
 return null;
}
function h(seed){let v=2166136261;for(const ch of String(seed)){v^=ch.charCodeAt(0);v=Math.imul(v,16777619);}return v>>>0}
function random(seed){let t=h(seed);return ()=>{t+=0x6d2b79f5;let q=t;q=Math.imul(q^(q>>>15),q|1);q^=q+Math.imul(q^(q>>>7),q|61);return ((q^(q>>>14))>>>0)/4294967296}}
function pick(r,min,max){return min+Math.floor(r()*(max-min+1))}
function rReduced(r,lo,hi){for(let i=0;i<50;i++){let d=pick(r,lo,hi),n=pick(r,1,d-1);if(gcd(n,d)===1)return {n,d};}return {n:1,d:2};}
const SKILLS=[
 {id:'equivalent',name:'Equivalent fractions'},
 {id:'simplify',name:'Simplifying fractions'},
 {id:'compare',name:'Comparing fractions'},
 {id:'add',name:'Adding fractions'},
 {id:'subtract',name:'Subtracting fractions'},
 {id:'of',name:'Fractions of whole numbers'},
 {id:'mixed',name:'Mixed and improper fractions'}
];
function one(skill,difficulty,r){const upper=difficulty==='easy'?7:difficulty==='challenge'?15:11;let a,b,t,answer,explanation,prompt,meta;
 switch(skill){
 case 'equivalent':{a=rReduced(r,2,upper);t=pick(r,2,difficulty==='challenge'?9:6);let D=a.d*t;answer=F(a.n*t,1);prompt=`${show(a)} = ?/${D}`;explanation=`Multiply numerator and denominator of ${show(a)} by ${t}. ${a.n} × ${t} = ${a.n*t}, so the missing numerator is ${a.n*t}.`;meta={a,t};break;}
 case 'simplify':{a=rReduced(r,2,upper);t=pick(r,2,difficulty==='challenge'?11:7);answer=F(a.n,a.d);prompt=`Simplify ${a.n*t}/${a.d*t}.`;explanation=`Divide both numbers by their greatest common factor, ${t}: (${a.n*t} ÷ ${t})/(${a.d*t} ÷ ${t}) = ${show(a)}.`;meta={a,t};break;}
 case 'compare':{a=rReduced(r,2,upper);b=rReduced(r,2,upper);let relation=compare(a,b);answer=relation<0?'<':relation>0?'>':'=';prompt=`Compare: ${show(a)}  ?  ${show(b)}  (enter <, >, or =)`;explanation=`Cross-multiply: ${a.n} × ${b.d} = ${a.n*b.d}; ${b.n} × ${a.d} = ${b.n*a.d}. Therefore ${show(a)} ${answer} ${show(b)}.`;meta={a,b};break;}
 case 'add':{a=rReduced(r,2,upper);b=rReduced(r,2,upper);if(difficulty==='easy')b=F(pick(r,1,a.d-1),a.d);answer=add(a,b);prompt=`${show(a)} + ${show(b)} = ?`;const common=a.d*b.d;explanation=`Use a common denominator: ${a.n*b.d}/${common} + ${b.n*a.d}/${common} = ${a.n*b.d+b.n*a.d}/${common} = ${show(answer)}.`;meta={a,b};break;}
 case 'subtract':{a=rReduced(r,2,upper);b=rReduced(r,2,upper);if(difficulty==='easy')b=F(pick(r,1,a.d-1),a.d);if(compare(a,b)<0)[a,b]=[b,a];answer=subtract(a,b);prompt=`${show(a)} − ${show(b)} = ?`;const common=a.d*b.d;explanation=`Use a common denominator: ${a.n*b.d}/${common} − ${b.n*a.d}/${common} = ${a.n*b.d-b.n*a.d}/${common} = ${show(answer)}.`;meta={a,b};break;}
 case 'of':{a=rReduced(r,2,upper);t=pick(r,2,difficulty==='challenge'?11:6);const total=a.d*t;answer=F(a.n*t,1);prompt=`What is ${show(a)} of ${total}?`;explanation=`Divide ${total} by ${a.d} to get ${t}, then multiply ${t} by ${a.n}. Answer: ${a.n*t}.`;meta={a,total};break;}
 case 'mixed':{let whole=pick(r,1,difficulty==='challenge'?7:4);a=rReduced(r,2,upper);answer=F(whole*a.d+a.n,a.d);prompt=`Write ${whole} ${show(a)} as an improper fraction.`;explanation=`Multiply the whole number by the denominator, then add the numerator: (${whole} × ${a.d} + ${a.n})/${a.d} = ${show(answer)}.`;meta={whole,a};break;}

 }

}
function makeSet({skill='equivalent',difficulty='standard',count=10,seed='classroom'}={}){
 if(!SKILLS.some(s=>s.id===skill)&&skill!=='mixed-review')throw Error('Unknown skill');
 count=Math.max(1,Math.min(40,Number(count)||10));const r=random(seed+'|'+skill+'|'+difficulty);const out=[];
 for(let i=0;i<count;i++){const s=skill==='mixed-review'?SKILLS[i%SKILLS.length].id:skill;const q=one(s,difficulty,r);out.push({...q,id:'q'+(i+1),number:i+1});}
 return out;
}
function isCorrect(q,input){if(q.kind==='comparison')return String(input||'').trim().replace('≤','<').replace('≥','>')===q.answer;const value=parse(input),expected=parse(q.answer);return Boolean(value&&expected&&compare(value,expected)===0)}

 switch(q.skill){case'equivalent':answer=F(m.a.n*m.t,1);break;case'simplify':answer=m.a;break;case'compare':answer=compare(m.a,m.b)<0?'<':compare(m.a,m.b)>0?'>':'=';break;case'add':answer=add(m.a,m.b);break;case'subtract':answer=subtract(m.a,m.b);break;case'of':answer=mul(m.a,F(m.total));break;case'mixed':answer=F(m.whole*m.a.d+m.a.n,m.a.d);break;default:return false}return (typeof answer==='string'?answer:show(answer))===q.answer;}

if(typeof module!=='undefined'&&module.exports)module.exports=global.TeacherMath;
})(typeof window!=='undefined'?window:globalThis);

function lessonDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(Error('Local file storage is not available in this browser.'));const req=indexedDB.open('teacher_studio_lesson_attachments_v2',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('files'))req.result.createObjectStore('files')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(Error('Cannot access local browser file storage.'))})}

 else if(f.id==='hub-book-form'){const u=safeURL(v.url);if(!u)throw Error('Use a complete book or library URL.');state.books.push({id:uid(),title:v.title,author:v.author,grade:v.grade,notes:v.notes,url:u})}
 else if(f.id==='hub-lesson-form'){if(!f.elements.rights.checked)throw Error('Confirm sharing rights first.');const l=sanitizeLesson({...v,license:'Original or authorized by creator'});if(!l)throw Error('Enter a title and steps.');const attachment=f.elements.attachment?.files?.[0];if(attachment){const name=attachment.name||'';if(!/\.(pdf|txt|docx)$/i.test(name)||attachment.size>5*1024*1024)throw Error('The optional attachment must be a PDF, TXT or DOCX under 5 MB.');await lessonFilePut(l.id,attachment);l.attachment_name=name.slice(0,120)}state.lessons.unshift(l)}
 else if(f.id==='hub-scan-grade'){const score=Number(v.score),possible=Number(v.possible);if(!Number.isFinite(score)||!Number.isFinite(possible)||score<0||possible<=0||score>possible)throw Error('Score must be between 0 and total points.');fileDownload('teacher-reviewed-scan-note.txt',`Teacher-reviewed work (local-only)\nAssignment: ${v.assignment||'Not specified'}\nScore: ${score}/${possible} (${Math.round(score/possible*100)}%)\nNotes: ${v.notes||'None'}\nDate: ${dateOffset(0)}\n\nNo image or grade was uploaded or shared.\n`,'text/plain');feedback('Review note downloaded. Grade has not been shared.');return;}

function icalSafe(t){return String(t??'').replace(/[\\;,\n]/g,c=>({'\\':'\\\\',';':'\\;',',':'\\,','\n':'\\n'}[c]))}
function exportCalendar(){let rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//TeacherStudio//Fictional Local School Hub//EN','CALSCALE:GREGORIAN'];for(const x of state.events){rows.push('BEGIN:VEVENT','UID:'+x.id+'@teacherstudio.local','DTSTART;VALUE=DATE:'+x.date.replaceAll('-',''),'SUMMARY:'+icalSafe(x.title),'DESCRIPTION:'+icalSafe(x.notes||''),'END:VEVENT')}rows.push('END:VCALENDAR');fileDownload('school-events-demo.ics',rows.join('\r\n'),'text/calendar');feedback('Calendar file exported. These are local demo events.');}

function saveScan(){const canvas=document.getElementById('hub-scan-canvas');if(!scan.image||!canvas)throw Error('Choose an image first.');canvas.toBlob(blob=>{if(!blob){feedback('Unable to export scan.',true);return;}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=String(scan.filename||'scan').replace(/[^\w.-]/g,'_').slice(0,70)+'-clean.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);feedback('Scanned image downloaded locally.');},'image/png')}

function handleClick(ev){const btn=ev.target.closest('[data-extra]');if(!btn)return;ev.preventDefault();ev.stopImmediatePropagation();const act=btn.dataset.extra;try{if(act==='tab'){tab=btn.dataset.tab;rerender();return}if(act==='month'){calendarMonth.setMonth(calendarMonth.getMonth()+Number(btn.dataset.step||0));rerender();return}if(act==='delete'){dataEnabled();const col=btn.dataset.collection;if(!['events','announcements','activities','faqs','resources','books','lessons'].includes(col))return;state[col]=state[col].filter(x=>x.id!==btn.dataset.id);save();rerender();feedback('Removed from this browser.');return}if(act==='export-calendar'){exportCalendar();return}if(act==='lesson-file'){const l=state.lessons.find(x=>x.id===btn.dataset.id);if(!l?.attachment_name)throw Error('No attached lesson file.');lessonFileGet(l.id).then(b=>{if(!b)throw Error('Attachment missing in this browser.');downloadBlobFile(l.attachment_name,b);feedback('Attachment downloaded locally.')}).catch(err=>feedback(err.message,true));return}if(act==='lesson-export'){const l=state.lessons.find(x=>x.id===btn.dataset.id);if(!l)throw Error('Lesson not found');fileDownload('teacher-lesson-'+l.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,50)+'.json',JSON.stringify({format:'teacher-studio-lesson-v1',lesson:l},null,2));feedback('Lesson file downloaded. Email it to a colleague.');return}if(act==='lessons-all'){fileDownload('teacher-lesson-library.json',JSON.stringify({format:'teacher-studio-lesson-library-v1',lessons:state.lessons},null,2));return}if(act==='rotate'){scan.rotation=(scan.rotation+90)%360;drawScan();return}if(act==='scan-download'){saveScan();return}if(act==='scan-print'){printScan();return}}catch(err){feedback(err.message,true)}}
async function handleChange(ev){const t=ev.target;if(t.id==='hub-resource-category'){resourceFilter=t.value;rerender();return}if(t.id==='hub-import-lessons'){if(!teacher())return;try{const file=t.files?.[0];if(!file)return;if(file.size>150*1024)throw Error('Lesson exchange files must be smaller than 150 KB.');const obj=JSON.parse(await file.text());if(!['teacher-studio-lesson-v1','teacher-studio-lesson-library-v1'].includes(obj.format))throw Error('Not a recognized Gloria Esser Teaching Tool lesson export.');const ls=(obj.lesson?[obj.lesson]:obj.lessons)||[];if(!Array.isArray(ls)||ls.length>50)throw Error('Too many lesson entries.');let saved=0;for(const raw of ls){const l=sanitizeLesson(raw);if(l){delete l.attachment_name;state.lessons.unshift(l);saved++}}if(!saved)throw Error('No valid lesson plans found.');save();rerender();feedback('Imported '+saved+' lessons into your local library.')}catch(err){feedback(err.message,true)}return}
 if(t.id==='hub-scan-file'){try{const file=t.files?.[0];if(!file)return;if(!file.type.startsWith('image/')||file.size>12*1024*1024)throw Error('Choose an image less than 12 MB.');const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{URL.revokeObjectURL(url);scan.image=im;scan.filename=file.name.replace(/\.[^.]+$/,'');scan.rotation=0;rerender();drawScan();feedback('Photo loaded; nothing uploaded.')};im.onerror=()=>{URL.revokeObjectURL(url);feedback('Cannot read this image.',true)};im.src=url;}catch(err){feedback(err.message,true)}return}
 if(t.id==='hub-grayscale'){scan.gray=t.checked;drawScan();return}}
function handleInput(ev){const t=ev.target;if(t.id==='hub-search'){resourceSearch=t.value;const active=document.activeElement;const selection=t.selectionStart;rerender();const input=document.getElementById('hub-search');input?.focus();if(input&&selection!==null)input.setSelectionRange(selection,selection);return}if(t.id==='hub-contrast'){scan.contrast=Number(t.value);document.getElementById('contrast-value').textContent=scan.contrast+'%';drawScan();return}if(t.id==='hub-brightness'){scan.brightness=Number(t.value);document.getElementById('brightness-value').textContent=scan.brightness+'%';drawScan();return}}
document.addEventListener('submit',handleSubmit,true);
document.addEventListener('click',handleClick,true);
document.addEventListener('change',handleChange,true);
document.addEventListener('input',handleInput,true);
window.TeacherExtras={render,afterRender:()=>{if(document.getElementById('hub-scan-canvas'))drawScan()},getStats:()=>({events:state.events.length,resources:CURATED.length+state.resources.length,lessons:state.lessons.length}),addLessonFromRemix:(lesson)=>{if(!teacher()||context.mode!=='demo')throw Error('Local Lesson Exchange requires teacher demo mode.');const prepared=sanitizeLesson(lesson);if(!prepared)throw Error('Invalid lesson: enter a title and teaching steps.');prepared.license='Original teacher-authored adaptation — verify before sharing';state.lessons.unshift(prepared);state.lessons=state.lessons.slice(0,100);if(!save())throw Error('Unable to save to browser storage.');return prepared.id}};
})();

function openDb(){return new Promise((ok,no)=>{if(!('indexedDB'in window)){no(Error('Photo storage is unavailable in this browser.'));return;}const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onerror=()=>no(r.error||Error('Could not open image storage.'));r.onsuccess=()=>ok(r.result)})}
async function savePhoto(file){if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPG, PNG or WebP image.');if(file.size>6*1024*1024)throw Error('Choose a photo smaller than 6 MB.');let blob=file;try{const bmp=await createImageBitmap(file);const max=1400,scale=Math.min(1,max/Math.max(bmp.width,bmp.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bmp.width*scale));canvas.height=Math.max(1,Math.round(bmp.height*scale));const cx=canvas.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,canvas.width,canvas.height);cx.drawImage(bmp,0,0,canvas.width,canvas.height);blob=await new Promise((ok,no)=>canvas.toBlob(x=>x?ok(x):no(Error('Cannot process image.')),'image/jpeg',.78));bmp.close?.()}catch(err){if(!blob)throw err}

function render(ctx){context={...context,...ctx};const cls=context.classroom;

 const warning=context.mode==='cloud'?`<div class="space-warning"><strong>Local draft only.</strong> This custom page is not synchronized through Supabase. The parent app on another device cannot see it yet.</div>`:`<div class="space-warning"><strong>Fictional demo.</strong> Content is saved on this device only. Parent preview works in this browser; no real parent receives it.</div>`;
 const toolbar=context.role==='teacher'?`<div class="space-toolbar"><div><div class="eyebrow">ONE PERSONALIZED PAGE PER CLASSROOM</div><h2 class="section-title">Your classroom, your style</h2><p class="section-sub">Choose a look, pin resources and events, and show off original artwork.</p></div><div class="space-toolbar-buttons"><button class="btn ghost" data-space="preview">${preview?'Back to editing':'Preview as family'}</button><button class="btn primary" data-space="publish" ${context.mode==='cloud'?'disabled':''}>Publish to demo family view</button></div></div>`:`<div class="space-toolbar"><div><h2 class="section-title">Your teacher's classroom</h2><p class="section-sub">Only classroom-family materials chosen by the teacher are shown.</p></div></div>`;
 return `<div class="space-workspace">${toolbar}${warning}<div class="space-columns ${editing?'space-editing':''}">${pageRoot}${editing?teacherEditor(record.draft):''}</div><p class="space-footer">Each teacher manages their own classroom. School-level announcements and official school contacts belong in the separate School Hub.</p></div>`;
}
async function afterRender(){for(const u of URLs)URL.revokeObjectURL(u);URLs=[];const images=[...document.querySelectorAll('img[data-space-photo]')];for(const el of images){try{const b=await findPhoto(el.dataset.spacePhoto);if(!el.isConnected)continue;if(b){const url=URL.createObjectURL(b);URLs.push(url);el.src=url}else{el.style.display='none'}}catch{if(el.isConnected)el.style.display='none'}}}
function update(cb){auth();cb(get(context.classroom).draft);save();window.teacherStudioRender?.();}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-space]');if(!b)return;if(b.dataset.space==='visibility')return;ev.preventDefault();ev.stopImmediatePropagation();try{const action=b.dataset.space;
 if(action==='preview'){auth();preview=!preview;window.teacherStudioRender?.();return}
 if(action==='publish'){auth();if(context.mode!=='demo')throw Error('Live parent publishing is disabled until server permissions are implemented.');const rec=get(context.classroom);rec.published=JSON.parse(JSON.stringify(rec.draft));save();alertUser('Published to this browser’s fictional family preview only.');window.teacherStudioRender?.();return}
 if(action==='move'){update(p=>{const idx=p.sections.indexOf(b.dataset.section),dest=idx+(b.dataset.direction==='up'?-1:1);if(idx<0||dest<0||dest>=p.sections.length)return;[p.sections[idx],p.sections[dest]]=[p.sections[dest],p.sections[idx]]});return}
 if(action==='delete'){const collection=b.dataset.collection,id=b.dataset.id;if(!['announcements','events','links','artwork'].includes(collection))return;update(p=>{p[collection]=p[collection].filter(x=>x.id!==id)});return}
 }catch(err){alertUser(err.message,true)}},true);
document.addEventListener('submit',async ev=>{const form=ev.target;if(!form.id?.startsWith('space-'))return;ev.preventDefault();ev.stopImmediatePropagation();try{auth();if(preview)throw Error('Return to editing first.');const fd=new FormData(form),val=n=>String(fd.get(n)||'').trim();const p=get(context.classroom).draft;
 switch(form.id){
 case 'space-style-form':{const t=val('theme');if(!themes[t])throw Error('Choose a provided theme.');Object.assign(p,{roomTitle:val('roomTitle').slice(0,90),teacherName:val('teacherName').slice(0,80),tagline:val('tagline').slice(0,130),welcome:val('welcome').slice(0,1100),favorites:val('favorites').slice(0,320),theme:t});break}
 case 'space-cover-form':{const placement=val('placement');if(!['teacherPhoto','banner'].includes(placement))throw Error('Invalid image placement.');p[placement]=await savePhoto(fd.get('image'));break}
 case 'space-announcement-form':{if(!val('title')||!val('body'))throw Error('Enter an announcement and message.');p.announcements.unshift({id:ID(),title:val('title').slice(0,130),body:val('body').slice(0,700)});p.announcements=p.announcements.slice(0,30);break}
 case 'space-event-form':{if(!/^\d{4}-\d{2}-\d{2}$/.test(val('date'))||!val('title'))throw Error('Enter an event and valid date.');p.events.push({id:ID(),title:val('title').slice(0,130),note:val('note').slice(0,220),date:val('date')});p.events=p.events.slice(-35);break}
 case 'space-link-form':{const url=safeUrl(val('url'));if(!url)throw Error('Use a complete HTTPS or HTTP URL.');p.links.push({id:ID(),title:val('title').slice(0,90),url});p.links=p.links.slice(-24);break}
 case 'space-art-form':{const audience=val('audience');if(!['teacher','student','class'].includes(audience))throw Error('Invalid audience.');const id=val('studentId');if(audience==='student'&&!context.students.some(s=>s.id===id))throw Error('Choose which fictional student’s guardian can see this artwork.');if(audience!=='teacher'&&!fd.get('rights'))throw Error('Confirm permissions for sharing this work.');if(p.artwork.length>=12)throw Error('The demonstration supports up to 12 artwork images per classroom.');const photoId=await savePhoto(fd.get('image'));p.artwork.unshift({id:ID(),title:val('title').slice(0,95),photoId,audience,studentId:audience==='student'?id:null});break}
 default:return;
 }
 save();window.teacherStudioRender?.();alertUser('Saved locally in this classroom’s draft. Select Publish to update the fictional family view.');
 }catch(err){console.error(err);alertUser(err.message,true)}},true);
document.addEventListener('change',ev=>{const b=ev.target;if(b.dataset.space!=='visibility')return;ev.stopImmediatePropagation();try{const v=b.checked,s=b.dataset.section;if(!SECTIONS.includes(s))throw Error('Invalid section.');update(p=>{p.visible[s]=v})}catch(err){alertUser(err.message,true)}},true);
window.TeacherSpace={render,afterRender};
})();

<script>
/* growth.js */

const link=(url,label)=>`<a class="growth-button" target="_blank" rel="noopener noreferrer" href="${H(url)}">${H(label)} ↗</a>`;

const note='<div class="growth-alert"><strong>Fictional-data, offline prototype.</strong> Do not enter real student information or identifying classroom stories. Scores and drafts are local to this browser and are not sent to parents or school systems.</div>';
const SKILLS={
 equivalent:{label:'Equivalent fractions',standard:'4.NF.A.1',coverage:'Prerequisite fraction equivalence',detail:'Build equivalent fractions with diagrams, folding strips, or equal partitions.',teacher:'Use a visual fraction strip to show that 1/2 and 2/4 cover the same amount. Ask students to justify the equivalence.',question:'What changes and what stays the same when both parts of a fraction are multiplied by 2?'},
 simplify:{label:'Simplifying fractions',standard:'4.NF.A.1',coverage:'Application of equivalent fraction reasoning',detail:'Show why simplifying represents the same quantity rather than a smaller amount.',teacher:'Represent 4/8 and 1/2 on aligned bars. Invite students to describe the unchanged quantity.',question:'Why do 4/8 and 1/2 name the same value?'},
 compare:{label:'Comparing fractions',standard:'4.NF.A.2',coverage:'Comparing fractions',detail:'Use common denominators, common numerators, and visual models.',teacher:'Start with two lengths on a 0–1 number line; only then discuss computational comparisons.',question:'Is 3/4 more or less than 2/3? Explain using a picture or number line.'},
 add:{label:'Adding fractions',standard:'5.NF.A.1',coverage:'Fraction addition practice, not the full standard',detail:'Add fractions using equivalent fractions and a common unit.',teacher:'Start with fraction strips and a mistaken example (1/2 + 1/3 = 2/5). Ask students to critique the reasoning before showing steps.',question:'Why does 1/2 + 1/3 not equal 2/5?'},
 subtract:{label:'Subtracting fractions',standard:'5.NF.A.1',coverage:'Fraction subtraction practice, not the full standard',detail:'Subtract using equivalent fractions and common units.',teacher:'Represent the subtraction on a model first. Contrast two valid common-denominator strategies.',question:'How do you know your difference is reasonable?'},
 of:{label:'Fractions of whole numbers',standard:'5.NF.B.4',coverage:'Partial support for multiplying fractions by whole numbers',detail:'Interpret fractions of groups and quantities using equal groups.',teacher:'Ask how many objects are in each equal part before multiplying. Draw several examples.',question:'What does 3/4 of 20 mean in a picture?'},
 mixed:{label:'Mixed and improper fractions',standard:'Prerequisite',coverage:'Foundational conversion; not a standalone grade-5 standard mapping',detail:'Connect mixed numbers to complete wholes and remaining parts.',teacher:'Use area or fraction-strip models to build 2 1/3, then count thirds as an improper fraction.',question:'Why is 2 1/3 equal to 7/3?'}
};
const SOURCE_STD='https://www.thecorestandards.org/Math/Content/5/NF/';
const SOURCE_STD4='https://www.thecorestandards.org/Math/Content/4/NF/';
const SOURCE_WWC='https://ies.ed.gov/ncee/wwc/PracticeGuide/15';
const SOURCE_TOOLKIT='https://ies.ed.gov/ncee/rel/fractions-grade-6';
const TEMPLATES=[
 {id:'strips',tag:'Visual first',title:'Fraction Strip Investigation',grade:'4–6',objective:'Explain equivalence and fraction operations using a visible model before a rule.',materials:'Fraction-strip cutouts or drawn equal bars; pencils',steps:'1. Present a concrete problem such as 1/2 + 1/4. Ask students to predict whether the answer is larger than 1/2.\n2. Draw two fraction bars of the same length. Partition them to show halves and fourths.\n3. Ask students to rename 1/2 as 2/4 and explain why the shaded amount did not change.\n4. Combine the shaded pieces and write 3/4.\n5. Pairs make a new example with different denominators and justify each step.\n6. Give a short, fresh exit ticket without the model and discuss errors.',why:'Concrete and visual reasoning makes the mathematics explainable rather than a memorized procedure.'},
 {id:'numberline',tag:'Visual reasoning',title:'Fractions on a Number Line',grade:'4–6',objective:'Compare fractions by representing their locations relative to benchmark values.',materials:'Blank 0–1 number lines and colored pencils',steps:'1. Place 0, 1/2, and 1 on the line.\n2. Show how to divide the entire unit into equal pieces.\n3. Plot 2/3 and 3/4 and have pairs defend which is larger.\n4. Ask for a second method: rename fractions or compare to a benchmark.\n5. Invite students to explain what would go wrong if the partitions were unequal.\n6. Check with a new comparison problem.',why:'Comparing fraction magnitudes builds a foundation for computational checks.'},
 {id:'detective',tag:'Misconception check',title:'Fraction Error Detective',grade:'5–6',objective:'Explain why a common incorrect fraction procedure does not work.',materials:'Board or projector; paper for student explanations',steps:'1. Write an intentionally incorrect example: 1/2 + 1/3 = 2/5.\n2. Ask students to decide whether the answer is plausible without calculating.\n3. Have pairs show with a diagram why a sum of two positive fractions cannot be less than 1/2 here.\n4. Model equivalent fractions with sixths and obtain 5/6.\n5. Have students invent a helpful correction to the original work.\n6. Retest on a new pair of fractions.',why:'Students explain the mathematical principle behind a common mistake.'},
 {id:'peer',tag:'Student voice',title:'You Teach It — Partner Explanation',grade:'4–6',objective:'Develop a clear explanation of a fraction strategy and evaluate an alternative.',materials:'Blank paper, fraction strips if needed',steps:'1. Assign each pair a fresh fraction question.\n2. Student A solves while Student B asks why each step is legitimate.\n3. Swap roles using a new question.\n4. Each pair writes one sentence describing the general mathematical idea.\n5. Invite two different approaches for classroom discussion.\n6. Close with an independent check.',why:'The teacher hears student reasoning rather than only the final answer.'},
 {id:'spiral',tag:'Retention',title:'Five-Minute Fraction Retrieval',grade:'4–6',objective:'Revisit fraction concepts previously taught using fresh short questions.',materials:'Five short questions or an offline Classroom Arcade activity',steps:'1. Start with two fraction skills taught earlier in the term.\n2. Provide one worked example only when students need a reminder.\n3. Give five short independent questions from new numbers.\n4. Ask students to mark an uncertain answer for discussion.\n5. Review the reasoning behind the most common error.\n6. Return to the same concept several days later with fresh questions.',why:'Short spaced retrieval can reveal misconceptions and support longer-term knowledge.'}
];
function teacherOnly(name){return `<div class="growth"><div class="growth-banner"><div><div class="growth-kicker">Gloria Esser Teaching Tool · Human first</div><h2>${H(name)}</h2><p>This feature is for teacher-led work. Families can see only materials a teacher explicitly publishes using an approved connected workflow.</p></div></div><div class="growth-alert">Switch to <strong>Teacher</strong> mode to edit. This demonstration does not publish to real families.</div></div>`}
function unavailable(){return `<div class="growth"><div class="growth-alert">These new tools are local-only demonstrations. Switch to <strong>Offline demo</strong> under Settings to use them. They are not connected to real student records.</div></div>`}
function wrap(content){return `<section class="growth">${flashUI()}${content}</section>`}
const skillSelect=(value)=>Object.entries(SKILLS).map(([key,s])=>`<option value="${H(key)}" ${key===value?'selected':''}>${H(s.label)}</option>`).join('');

function statsCard(n,label){return `<div class="growth-stat"><strong>${H(n)}</strong><span>${H(label)}</span></div>`}
function masterPage(){const d=current();const skill=activity?.skill||chosenSkill,info=SKILLS[skill],last=lastAttempt(d.attempts,'diagnostic',skill),after=lastAttempt(d.attempts,'retest',skill),count=d.attempts.length;
 const statline=`<div class="growth-4">${statsCard(count,'Completed demo checks')}${statsCard(new Set(d.attempts.map(x=>x.skill)).size,'Skills checked')}${statsCard(last?`${Math.round(100*last.score/last.max)}%`:'—','Latest diagnostic')}${statsCard(after?`${Math.round(100*after.score/after.max)}%`:'—','Latest retest')}</div>`;
 const lastLine=last&&after?`<div class="growth-card" style="margin-top:14px"><h3>Before and after — ${H(info.label)}</h3><p>Comparing the latest short diagnostic and retest. Different questions, not a standardized score or proof of instruction effectiveness.</p><div class="growth-2"><div><strong>Diagnostic ${Math.round(last.score/last.max*100)}%</strong><div class="growth-bar"><span style="width:${Math.round(last.score/last.max*100)}%"></span></div></div><div><strong>Retest ${Math.round(after.score/after.max*100)}%</strong><div class="growth-bar"><span style="width:${Math.round(after.score/after.max*100)}%"></span></div></div></div><p style="margin-top:12px"><strong>Difference: ${Math.round((after.score/after.max-last.score/last.max)*100)>0?'+':''}${Math.round((after.score/after.max-last.score/last.max)*100)} percentage points.</strong> The short sets are for exploration, not diagnostic classification.</p></div>`:'';
 const startForm=`<div class="growth-card"><h3>Choose a skill and start a check</h3><p>Use a fictional or anonymous practice session. The question generator is fully offline.</p><div class="growth-2"><label class="growth-control">Skill<select id="growth-skill">${skillSelect(skill)}</select></label><label class="growth-control">Difficulty<select id="growth-level"><option value="easy" ${chosenLevel==='easy'?'selected':''}>Entry</option><option value="standard" ${chosenLevel==='standard'?'selected':''}>Standard</option><option value="challenge" ${chosenLevel==='challenge'?'selected':''}>Challenge</option></select></label></div><div class="growth-actions"><button class="growth-button primary" data-growth="start" data-phase="diagnostic">1 · Start diagnostic</button><button class="growth-button" data-growth="start" data-phase="practice">2 · Guided practice</button><button class="growth-button dark" data-growth="start" data-phase="retest">3 · Fresh retest</button></div><p class="growth-note">Eight new questions per check. The teacher can review every explanation. No child accounts or names.</p></div>`;
 const sourceCard=`<div class="growth-card"><div class="growth-row"><h3>Instructional guidance</h3><span class="growth-pill">${H(info.standard)}</span></div><p>${H(info.coverage)}. ${H(info.detail)}</p><ul class="growth-list"><li><strong>Try in class:</strong> ${H(info.teacher)}</li><li><strong>Ask students:</strong> ${H(info.question)}</li></ul><div class="growth-actions"><button class="growth-button" data-action="nav" data-page="remix">Open adaptable lesson ideas →</button></div><div class="growth-source">${link(info.standard.startsWith('4.')?SOURCE_STD4:SOURCE_STD,info.standard.startsWith('4.')?'Grade 4 fraction standards':'Grade 5 fraction standards')}${link(SOURCE_WWC,'IES fractions practice guide')}</div><p class="growth-note">Standards labels are approximate skill references, not a complete state-standard alignment or certified curriculum. Check your adopted standards.</p></div>`;
 const history=d.attempts.length?`<div class="growth-card" style="margin-top:14px"><h3>Local practice history</h3><p>Anonymous, classroom-specific demo attempts. No named student profiles.</p><div style="display:grid;gap:8px">${d.attempts.slice(-8).reverse().map(x=>`<div class="growth-row" style="border-bottom:1px solid #ebf0f0;padding-bottom:8px"><div><strong style="font-size:12px">${H(SKILLS[x.skill]?.label||x.skill)}</strong><p style="margin:0;font-size:11px">${H(x.phase)} · ${H(x.date)}</p></div><span class="growth-pill">${x.score}/${x.max}</span></div>`).join('')}</div><div class="growth-actions"><button class="growth-button" data-growth="export-history">Export anonymous results</button><button class="growth-button" data-growth="clear-history">Clear demo history</button></div></div>`:'';
 let work='';

 if(activity?.status==='results')work=`<div class="growth-card" style="margin-top:14px"><div class="growth-row"><h3>Your ${H(activity.phase)} review</h3><span class="growth-score">${activity.score}/8</span></div><p>${activity.score===8?'All eight correct on this set. Check again later for durable understanding.':'Review the explanations and help learners explain the reasoning, then give fresh questions.'}</p><div class="growth-bar"><span style="width:${Math.round(activity.score/8*100)}%"></span></div>${activity.feedback.map((x,i)=>`<div class="growth-result ${x.correct?'right':'wrong'}"><div class="growth-row"><strong>${i+1}. ${H(x.prompt)}</strong><span class="growth-pill ${x.correct?'':'sand'}">${x.correct?'Correct':'Needs review'}</span></div><p>Entered: <strong>${H(x.entered||'(blank)')}</strong> · Expected: <strong>${H(x.expected)}</strong></p><p>${H(x.explanation)}</p></div>`).join('')}<div class="growth-actions"><button class="growth-button primary" data-growth="start" data-phase="retest">Try a fresh retest</button><button class="growth-button" data-action="nav" data-page="remix">Explore teaching approaches</button><button class="growth-button" data-growth="discard">Close review</button></div></div>`;
 return wrap(`<div class="growth-banner"><div><div class="growth-kicker">Assess → Teach → Practice → Retest</div><h2>Standards & Mastery Center</h2><p>Find the concept behind a wrong answer, choose a teaching approach, and check understanding again. You make the instructional decisions.</p></div><div class="growth-banner-symbol" aria-hidden="true">◎</div></div>${statline}<div class="growth-2" style="margin-top:14px">${startForm}${sourceCard}</div>${work}${lastLine}${history}`);

function remixPage(){const d=current(),template=TEMPLATES.find(x=>x.id===activeTemplate)||TEMPLATES[0];const example=localLesson||template;
 const gallery=`<div class="growth-3">${TEMPLATES.map(t=>`<div class="growth-card growth-template"><span class="growth-pill">${H(t.tag)}</span><h3>${H(t.title)}</h3><p>${H(t.why)}</p><small>Grades ${H(t.grade)} · Original, editable lesson scaffold</small><button class="growth-button ${template.id===t.id?'primary':''}" data-growth="template" data-id="${H(t.id)}">${template.id===t.id?'Selected':'Use this approach'}</button></div>`).join('')}</div>`;
 const lessonForm=`<div class="growth-card" style="margin-top:15px"><div class="growth-row"><div><div class="growth-kicker">A starting point, not a script</div><h3>Remix ${H(template.title)}</h3></div><span class="growth-pill purple">Editable</span></div><p>The scaffold is original. Change the language, materials and teaching steps to fit your own students.</p><form id="growth-remix-form"><div class="growth-2"><label class="growth-control">Lesson title<input name="title" value="${H(example.title||'')}" maxlength="140" required></label><label class="growth-control">Grade / audience<input name="grade" value="${H(example.grade||ctx.grade)}" maxlength="40"></label></div><label class="growth-control">Learning objective<textarea name="objective" maxlength="600" rows="2">${H(example.objective||'')}</textarea></label><label class="growth-control">Materials<textarea name="materials" maxlength="800" rows="2">${H(example.materials||'')}</textarea></label><label class="growth-control">Teaching steps<textarea name="steps" rows="10" maxlength="8000" required>${H(example.steps||'')}</textarea></label><label class="growth-control">Teacher notes / adaptations<textarea name="notes" rows="3" maxlength="2000" placeholder="How will you adapt this for your own teaching style?">${H(example.notes||'')}</textarea></label><div class="growth-actions"><button class="growth-button primary" type="submit">Save my lesson locally</button><button type="button" class="growth-button" data-growth="reset-editor">Reset to original scaffold</button></div></form></div>`;
 const saved=`<div class="growth-card" style="margin-top:15px"><div class="growth-row"><h3>My remixed lessons</h3><span class="growth-pill">${d.remixes.length} saved</span></div><p>Stored per classroom in this browser, not published to the teacher network.</p>${d.remixes.length?d.remixes.map(l=>`<div class="growth-result"><div class="growth-row"><div><strong>${H(l.title)}</strong><p style="margin:3px 0">Grades ${H(l.grade)} · ${H(l.date)}</p></div><span class="growth-pill purple">Personal copy</span></div><div class="growth-actions"><button class="growth-button" data-growth="export-remix" data-id="${H(l.id)}">Download lesson</button><button class="growth-button" data-growth="to-exchange" data-id="${H(l.id)}">Copy to Lesson Exchange</button><button class="growth-button" data-growth="delete-remix" data-id="${H(l.id)}">Delete</button></div></div>`).join(''):'<p>Choose a teaching approach above, change it, and save your first lesson.</p>'}</div>`;
 return wrap(`<div class="growth-banner"><div><div class="growth-kicker">Borrow ideas · Keep your own voice</div><h2>Teach It Better</h2><p>Discover original lesson starting points grounded in instructional principles, then modify them. Teachers remain the authors of their own classroom experience.</p></div><div class="growth-banner-symbol" aria-hidden="true">✎</div></div><div class="growth-alert"><strong>Copyright boundary:</strong> These five lesson scaffolds were written for Gloria Esser Teaching Tool. External resources below are links, not content copied into the application. Confirm permissions before exchanging third-party lessons.</div>${gallery}${lessonForm}${saved}<div class="growth-card" style="margin-top:14px"><h3>Research starting points</h3><p>Use these credible sources for instructional decisions. Standards alignment and effectiveness still require teacher judgment.</p><div class="growth-actions">${link(SOURCE_WWC,'IES fractions practice guide')}${link(SOURCE_TOOLKIT,'IES teaching fractions toolkit')}${link(SOURCE_STD,'Grade 5 standards')}</div></div>`);
}
function legacyPage(){const d=current(),p=d.profile;return wrap(`<div class="growth-banner" style="background:linear-gradient(110deg,#513d7d,#a56b75)"><div><div class="growth-kicker" style="color:#ffe7bd">Your teaching story · Private by default</div><h2>Remember Why You Teach</h2><p>Capture what makes your classroom unique: your philosophy, greatest lessons, proud moments and memories. No pressure to post. No artificial praise.</p></div><div class="growth-banner-symbol" aria-hidden="true">♡</div></div><div class="growth-2"><div class="growth-card"><div class="growth-kicker">My teaching story</div><h3>The person behind the classroom</h3><p>Your professional narrative belongs to you. Saved locally for this one fictional classroom.</p><form id="growth-profile-form"><label class="growth-control">Why I became a teacher<textarea name="why" maxlength="1200" placeholder="What brought me to teaching?">${H(p.why||'')}</textarea></label><label class="growth-control">My teaching philosophy<textarea name="philosophy" maxlength="1200" placeholder="What do I believe helps students thrive?">${H(p.philosophy||'')}</textarea></label><label class="growth-control">What I'm most proud of<textarea name="proud" maxlength="1200" placeholder="A breakthrough, an accomplishment, a tradition...">${H(p.proud||'')}</textarea></label><label class="growth-control">My favorite lessons and traditions<textarea name="favorites" maxlength="1200" placeholder="Favorite lessons, books, projects and ideas...">${H(p.favorites||'')}</textarea></label><div class="growth-actions"><button type="submit" class="growth-button primary">Save my teaching story</button></div></form></div><div class="growth-card"><div class="growth-kicker">Our classroom legacy</div><h3>Add a moment worth remembering</h3><p>Use general, non-identifying descriptions. No student names, faces, signatures, exact dates, or distinctive identifying details.</p><form id="growth-memory-form"><label class="growth-control">Kind of memory<select name="kind"><option>Classroom tradition</option><option>Favorite lesson</option><option>Idea students taught me</option><option>Creative project</option><option>Breakthrough moment</option><option>Professional milestone</option></select></label><label class="growth-control">Title<input name="title" maxlength="100" placeholder="The question that changed my lesson" required></label><label class="growth-control">Memory<textarea name="body" maxlength="1000" rows="5" placeholder="Tell the story without details that identify any child." required></textarea></label><label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#405c70"><input type="checkbox" name="privacy" style="width:auto;margin-top:3px" required> I confirm this contains no identifiable student information and is suitable for this fictional local demo.</label><div class="growth-actions"><button type="submit" class="growth-button primary">Save private memory</button></div></form><div class="growth-alert" style="margin-top:15px">Nothing on this page is published to families. In a future connected release, sharing would require explicit review, school authorization and applicable permissions.</div></div></div><div class="growth-card" style="margin-top:15px"><div class="growth-row"><div><div class="growth-kicker">Your time capsule</div><h3>Classroom Legacy Wall</h3></div><span class="growth-private">Private · This device</span></div>${d.moments.length?`<div class="growth-2">${d.moments.map(m=>`<div class="growth-moment"><div class="growth-row"><span class="growth-pill purple">${H(m.kind)}</span><span class="growth-private">Not published</span></div><h3 style="margin-top:10px">${H(m.title)}</h3><p>${H(m.body)}</p><button class="growth-button" data-growth="delete-memory" data-id="${H(m.id)}">Remove memory</button></div>`).join('')}</div>`:'<div class="growth-paper">One day, this space might hold the moments that remind you why you teach. Add a private teaching memory when you are ready.</div>'}<div class="growth-actions"><button class="growth-button" data-growth="export-story">Download my teaching portfolio</button></div></div>`)}
function render(page,meta={}){ctx={...ctx,...meta};const name=page==='mastery'?'Standards & Mastery':page==='remix'?'Teach It Better':'Remember Why';if(ctx.role!=='teacher')return teacherOnly(name);if(ctx.mode!=='demo')return unavailable();return page==='mastery'?masterPage():page==='remix'?remixPage():legacyPage();}
function requireLesson(id){const result=current().remixes.find(l=>l.id===id);if(!result)throw Error('Lesson not found in this fictional classroom.');return result;}
function handleGrowthClick(ev){const b=ev.target.closest('[data-growth]');if(!b)return;ev.preventDefault();ev.stopImmediatePropagation();try{guard();flash='';const cmd=b.dataset.growth,d=current();
 switch(cmd){
 case 'start':{const s=document.getElementById('growth-skill')?.value||activity?.skill||chosenSkill,level=document.getElementById('growth-level')?.value||chosenLevel,phase=b.dataset.phase;chosenSkill=s;chosenLevel=level;if(!SKILLS[s]||!['diagnostic','practice','retest'].includes(phase))throw Error('Choose a supported skill and check type.');const seed='growth-'+uid(),questions=M.makeSet({skill:s,difficulty:level,count:8,seed});if(questions.length!==8||!questions.every(M.verify))throw Error('Question validation failed.');activity={status:'questions',skill:s,level,phase,questions,seed};rerender();break}
 case 'discard':activity=null;rerender();break;
 case 'template':{const t=TEMPLATES.find(x=>x.id===b.dataset.id);if(!t)throw Error('Unknown template.');activeTemplate=t.id;localLesson=null;rerender();break}
 case 'reset-editor':localLesson=null;rerender();break;
 case 'delete-remix':{if(!confirm('Delete this local lesson?'))return;d.remixes=d.remixes.filter(x=>x.id!==b.dataset.id);save();flashMsg('Removed from the local lesson library.');break}
 case 'export-remix':{const l=requireLesson(b.dataset.id);download('teacher-studio-lesson-'+l.id+'.json',JSON.stringify({format:'teacher-studio-lesson-v1',lesson:{...l,subject:'Math',license:'Original teacher-authored adaptation',owner:'Local teacher'}},null,2));flashMsg('Downloaded a lesson file that can be imported into Lesson Exchange.');break}
 case 'to-exchange':{const l=requireLesson(b.dataset.id);if(typeof window.TeacherExtras?.addLessonFromRemix!=='function')throw Error('Lesson Exchange bridge unavailable.');window.TeacherExtras.addLessonFromRemix({...l,subject:'Math',owner:'Local teacher',license:'Original teacher-authored adaptation'});flashMsg('Copied to Lesson Exchange on this device. Review it before sharing externally.');break}
 case 'delete-memory':{if(!confirm('Remove this private memory?'))return;d.moments=d.moments.filter(x=>x.id!==b.dataset.id);save();flashMsg('Private memory removed.');break}
 case 'export-story':{const result={format:'teacher-studio-teaching-portfolio-v1',exported:day(),profile:d.profile,moments:d.moments};download('my-teaching-portfolio.json',JSON.stringify(result,null,2));flashMsg('Downloaded teaching portfolio JSON. Review privacy before distributing.');break}
 case 'export-history':download('anonymous-mastery-history.json',JSON.stringify({format:'teacher-studio-anonymous-mastery-v1',attempts:d.attempts},null,2));flashMsg('Downloaded anonymous practice history.');break;
 case 'clear-history':{if(!confirm('Delete anonymous demo results in this classroom?'))return;d.attempts=[];activity=null;save();flashMsg('Anonymous practice history cleared.');break}
 default:return;
 }
 }catch(err){console.error(err);flashMsg(err.message)}}
function handleGrowthSubmit(ev){const f=ev.target;if(!f?.id?.startsWith('growth-'))return;ev.preventDefault();ev.stopImmediatePropagation();try{guard();flash='';const fd=new FormData(f);const val=(k,max=8000)=>String(fd.get(k)||'').trim().slice(0,max);const d=current();
 switch(f.id){
 case 'growth-answers-form':{if(!activity||activity.status!=='questions')throw Error('Start a practice set first.');const feedback=activity.questions.map((q,i)=>{const entered=val('q'+i,50),correct=M.isCorrect(q,entered);return {prompt:q.prompt,entered,expected:q.answer,correct,explanation:q.explanation}});const score=feedback.filter(x=>x.correct).length;activity={...activity,status:'results',score,feedback};d.attempts.push({id:uid(),date:day(),phase:activity.phase,skill:activity.skill,level:activity.level,score,max:activity.questions.length});d.attempts=d.attempts.slice(-100);save();rerender();break}
 case 'growth-remix-form':{const data={id:uid(),date:day(),title:val('title',140),grade:val('grade',40)||ctx.grade,objective:val('objective',600),materials:val('materials',800),steps:val('steps',8000),notes:val('notes',2000)};if(!data.title||data.steps.length<15)throw Error('Give your lesson a title and at least one meaningful teaching step.');d.remixes.unshift(data);d.remixes=d.remixes.slice(0,40);save();localLesson=data;flashMsg('Saved your remixed lesson locally. It is not shared or published.');break}
 case 'growth-profile-form':{for(const k of ['why','philosophy','proud','favorites'])d.profile[k]=val(k,1200);save();flashMsg('Your teaching story was saved privately in this classroom.');break}
 case 'growth-memory-form':{if(!fd.get('privacy'))throw Error('Confirm that your example contains no identifying student information.');const title=val('title',100),body=val('body',1000),kind=val('kind',40);if(!title||body.length<10||!['Classroom tradition','Favorite lesson','Idea students taught me','Creative project','Breakthrough moment','Professional milestone'].includes(kind))throw Error('Enter a valid title, type, and non-identifying memory.');d.moments.unshift({id:uid(),kind,title,body,date:day()});d.moments=d.moments.slice(0,50);save();flashMsg('Saved privately on this device. It is not shown to families.');break}
 default:return;
 }
 }catch(err){console.error(err);flashMsg(err.message)}}
document.addEventListener('click',handleGrowthClick,true);
document.addEventListener('submit',handleGrowthSubmit,true);
document.addEventListener('change',ev=>{if(ev.target.id==='growth-skill'){chosenSkill=ev.target.value;activity=null;flash='';rerender();}if(ev.target.id==='growth-level'){chosenLevel=ev.target.value;}},true);
window.TeacherGrowth={render,afterRender:()=>{},SKILLS,TEMPLATES,getRemixes:(classId)=>{const rec=db.classes[String(classId||'')];return Array.isArray(rec?.remixes)?structuredClone(rec.remixes):[]},getProfile:(classId)=>{const rec=db.classes[String(classId||'')];return rec?.profile?structuredClone(rec.profile):null},getMoments:(classId)=>{const rec=db.classes[String(classId||'')];return Array.isArray(rec?.moments)?structuredClone(rec.moments):[]}};
})();
