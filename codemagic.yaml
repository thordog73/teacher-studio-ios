# Gloria Esser Teaching Tool iOS — App Store Connect / TestFlight. Set exact App Store Connect
# integration name and bundle identifier before running a signed workflow.
# First run ios-compile-check, then ios-testflight. Capacitor 8 explicitly uses CocoaPods for this configuration.
workflows:
  ios-compile-check:
    name: Gloria Esser Teaching Tool - iOS compile check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Validate upload package and build settings
        script: python3 scripts/ci-preflight.py
      - name: Print toolchain versions
        script: |
          node --version
          npm --version
          xcodebuild -version
          python3 scripts/ci-preflight.py --check-xcode
      - name: Install Capacitor and build dependencies
        script: npm install --no-fund --no-audit --fetch-retries=3
      - name: Verify inherited code and construct web app
        script: |
          npm run test
          npm run test:package
          npm run build
      - name: Generate Capacitor iOS application
        script: |
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
          python3 scripts/prepare_ios.py
      - name: Install iOS pods and attach privacy manifest
        script: |
          cd ios/App && pod install && cd ../..
          ruby scripts/attach_privacy.rb
      - name: Compile iPhone Simulator app without signing
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
  ios-testflight:
    name: Gloria Esser Teaching Tool - Signed iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: TeacherStudioASC # Must match integration name in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.frontofus.teacherstudio # Must match ASC + capacitor.config.json
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Validate upload package and build settings
        script: python3 scripts/ci-preflight.py
      - name: Print toolchain versions
        script: |
          node --version
          npm --version
          xcodebuild -version
          python3 scripts/ci-preflight.py --check-xcode
      - name: Install dependencies
        script: npm install --no-fund --no-audit --fetch-retries=3
      - name: Verify tests and create offline web assets
        script: |
          npm run test
          npm run test:package
          npm run build
      - name: Generate native iOS source
        script: |
          npx cap add ios --packagemanager CocoaPods
          npx cap sync ios
          python3 scripts/prepare_ios.py
      - name: Install pods and apply App Store privacy declaration
        script: |
          cd ios/App && pod install && cd ../..
          ruby scripts/attach_privacy.rb
      - name: Configure App Store signing
        script: |
          cd ios/App
          xcode-project use-profiles
      - name: Archive signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
