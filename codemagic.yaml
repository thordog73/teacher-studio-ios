# Teacher Studio iOS — App Store Connect / TestFlight.
# UPDATE.cmd starts ios-testflight through the Codemagic API.
# The existing TeacherStudioASC integration supplies Apple signing and publishing.
workflows:
  ios-compile-check:
    name: Teacher Studio - iOS compile check (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Capacitor and build dependencies
        script: npm install --no-fund --no-audit
      - name: Verify inherited code and construct web app
        script: |
          set -euo pipefail
          npm run test
          npm run test:package
          npm run build
      - name: Generate Capacitor iOS application
        script: |
          set -euo pipefail
          npx cap add ios --packagemanager CocoaPods
          test -f ios/App/Podfile || { echo "Expected CocoaPods project: ios/App/Podfile is missing." >&2; exit 1; }
          npx cap sync ios
          python3 scripts/prepare_ios.py
      - name: Install iOS pods and attach privacy manifest
        script: |
          set -euo pipefail
          (cd ios/App && pod install)
          ruby scripts/attach_privacy.rb
      - name: Compile iPhone Simulator app without signing
        script: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
  ios-testflight:
    name: Teacher Studio - Signed iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: TeacherStudioASC # Must match integration name in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.frontofus.teacherstudio # Must match ASC + capacitor.config.json
      node: 22
      xcode: latest
      cocoapods: default
    scripts:
      - name: Verify uploaded source and app identity
        script: |
          set -euo pipefail
          if [ -n "${TEACHER_STUDIO_EXPECTED_COMMIT:-}" ]; then
            if [ "$(git rev-parse HEAD)" != "$TEACHER_STUDIO_EXPECTED_COMMIT" ]; then
              echo "GitHub source changed after upload. Run UPDATE.cmd again." >&2
              exit 1
            fi
          fi
          node -e 'const c = require("./capacitor.config.json"); if (c.appId !== "com.frontofus.teacherstudio") { console.error("Teacher Studio bundle identifier does not match the signed workflow."); process.exit(1); }'
      - name: Install dependencies
        script: npm install --no-fund --no-audit
      - name: Verify tests and create offline web assets
        script: |
          set -euo pipefail
          npm run test
          npm run test:package
          npm run build
      - name: Generate native iOS source
        script: |
          set -euo pipefail
          npx cap add ios --packagemanager CocoaPods
          test -f ios/App/Podfile || { echo "Expected CocoaPods project: ios/App/Podfile is missing." >&2; exit 1; }
          npx cap sync ios
          python3 scripts/prepare_ios.py
      - name: Install pods and apply App Store privacy declaration
        script: |
          set -euo pipefail
          (cd ios/App && pod install)
          ruby scripts/attach_privacy.rb
      - name: Configure App Store signing
        script: |
          set -euo pipefail
          cd ios/App
          xcode-project use-profiles
      - name: Archive signed IPA
        script: |
          set -euo pipefail
          cd ios/App
          xcode-project build-ipa --workspace App.xcworkspace --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
